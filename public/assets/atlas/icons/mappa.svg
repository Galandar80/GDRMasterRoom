<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#e2b55f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Compass Circular Frame -->
  <circle cx="50" cy="50" r="39" stroke-width="5" fill="#e2b55f" fill-opacity="0.15" />
  <circle cx="50" cy="50" r="43" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Dial marks (North, South, East, West) -->
  <path d="M50 7v6M50 87v6M7 50h6M87 50h6" stroke-width="3" />
  
  <!-- Diagonal compass rose points -->
  <path d="M22 22l5 5M78 78l-5-5M78 22l-5 5M22 78l5-5" stroke-width="2" opacity="0.7" />
  
  <!-- Compass Needle (North pointing with golden fill) -->
  <polygon points="50,16 57,48 50,56" fill="#e2b55f" stroke="#e2b55f" stroke-width="2" />
  <polygon points="50,16 43,48 50,56" fill="#ffe1b5" stroke="#e2b55f" stroke-width="2" />
  
  <!-- Compass Needle (South pointing, outline only) -->
  <polygon points="50,84 57,52 50,56" stroke="#e2b55f" stroke-width="2" />
  <polygon points="50,84 43,52 50,56" stroke="#e2b55f" stroke-width="2" />
  
  <!-- Central brass pivot -->
  <circle cx="50" cy="50" r="4.5" fill="#ffe1b5" stroke="#e2b55f" stroke-width="1.5" />
</svg>
